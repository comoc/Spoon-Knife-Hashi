# Installed with audited code pin. Review/publishing remain gated by explicit enable variables.
name: AI push review pilot
on:
  push:
    branches: [master]
permissions: {}
concurrency:
  group: ai-push-review-pilot
  cancel-in-progress: false
  queue: max # Up to 100 pending; additional runs are canceled, not guaranteed delivery.
env:
  TRUSTED_REVIEW_SHA: 3c5a4451e01d9306a93a99b56253e19bfd3100fd
  AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
  AI_PUBLISH_ENABLED: ${{ vars.AI_PUBLISH_ENABLED }}
jobs:
  reserve:
    if: github.event.deleted == false && github.event.created == false && github.event.forced == false && vars.AI_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ai-review-budget
    permissions:
      contents: write # Budget ledger CAS; protected trusted runner only
    steps:
      - name: Load only audited reviewer; never checkout pushed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, re, urllib.request, json
          sha=os.environ['TRUSTED_REVIEW_SHA']
          assert re.fullmatch('[0-9a-f]{40}',sha), 'Pin audited reviewer before enabling'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/ai-review/review.py?ref='+sha
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('API redirect refused')
          with urllib.request.build_opener(NoRedirect()).open(req,timeout=30) as r: doc=json.load(r)
          assert doc['type']=='file' and doc['size']<50000
          open(os.environ['RUNNER_TEMP']+'/trusted-review.py','wb').write(base64.b64decode(doc['content']))
          PY
      - name: Reserve USD1 atomically before any paid request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/trusted-review.py" reserve
  review:
    needs: reserve
    if: github.event.deleted == false && github.event.created == false && github.event.forced == false && vars.AI_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ai-review
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.review.outputs.findings }}
    steps:
      - name: Load only audited reviewer; never checkout pushed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, re, urllib.request, json
          sha=os.environ['TRUSTED_REVIEW_SHA']
          assert re.fullmatch('[0-9a-f]{40}',sha), 'Pin audited reviewer before enabling'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/ai-review/review.py?ref='+sha
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('API redirect refused')
          with urllib.request.build_opener(NoRedirect()).open(req,timeout=30) as r: doc=json.load(r)
          assert doc['type']=='file' and doc['size']<50000
          open(os.environ['RUNNER_TEMP']+'/trusted-review.py','wb').write(base64.b64decode(doc['content']))
          PY
      - name: Read-only bounded review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          INPUT_USD_PER_MILLION: ${{ vars.INPUT_USD_PER_MILLION }}
          OUTPUT_USD_PER_MILLION: ${{ vars.OUTPUT_USD_PER_MILLION }}
          MODEL_MAX_INPUT_TOKENS: ${{ vars.MODEL_MAX_INPUT_TOKENS }}
          PRICING_VALID_UNTIL: ${{ vars.PRICING_VALID_UNTIL }}
          MAX_USD_PER_RUN: ${{ vars.MAX_USD_PER_RUN }}
        run: python3 "$RUNNER_TEMP/trusted-review.py" review
  publish:
    needs: review
    if: vars.AI_PUBLISH_ENABLED == 'true' && needs.review.outputs.findings != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ai-review-publish
    permissions:
      contents: read
      issues: write
    steps:
      - name: Load audited publisher in fresh VM without model key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, re, urllib.request, json
          sha=os.environ['TRUSTED_REVIEW_SHA']
          assert re.fullmatch('[0-9a-f]{40}',sha), 'Pin audited reviewer before enabling'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/ai-review/review.py?ref='+sha
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('API redirect refused')
          with urllib.request.build_opener(NoRedirect()).open(req,timeout=30) as r: doc=json.load(r)
          assert doc['type']=='file' and doc['size']<50000
          open(os.environ['RUNNER_TEMP']+'/trusted-review.py','wb').write(base64.b64decode(doc['content']))
          PY
      - name: Revalidate against GitHub and publish at most three issues
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_FINDINGS: ${{ needs.review.outputs.findings }}
        run: python3 "$RUNNER_TEMP/trusted-review.py" publish
